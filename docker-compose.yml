services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pc_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pc-store-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pc_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pc-store-postgres:
